run:
  seed: 0
  dataset: cifar10
  device: cuda
  record_data: false
  test_batchsize: 32
  num_clients: 5
  dirichlet_alpha: 0.1
  client_id: 0
  num_samplings: 5000


training:
  train_ratio: 1.0
  client_selected_ratio: 0.15
  rounds: 100
  warmup_ratio: 0.01

servers:
  calder:
    results_path: /scratch-calder/users/sc21s2j/weighted_sampling/results/
    dataset_path: /scratch-calder/users/sc21s2j/dataset/
  aire:
    results_path: /scratch/users/sc21s2j/weighted_sampling/results/
    dataset_path: /scratch/users/sc21s2j/dataset/
  swjtu:
    results_path: /scratch/users/sc21s2j/weighted_sampling/results/
    dataset_path: /scratch/users/sc21s2j/dataset/
  mine:
    results_path: "F:/pycodes/weighted_sampling/results"
    dataset_path: "F:/data"

datasets:
  cifar10:
    num_classes: 10
    client_epochs: 1000
    image_size: 32
    batch_size: 128
    lr: 2.0e-4
    T: 1000
